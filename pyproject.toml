[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recallnext"
version = "0.1.0"
description = "Evidence-optimized food recall investigation on Exasol Personal"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1",
  "pyexasol>=2.2.3,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.16,<1",
]

[project.scripts]
recallnext-generate-fixture = "data.generate_fixture:main"
recallnext-load-fixture = "data.load_fixture:main"
recallnext-import-openfda = "data.import_openfda:main"
recallnext-measure-live = "data.measure_live:main"
recallnext-smoke = "backend.smoke:main"

[tool.setuptools.packages.find]
include = ["backend*", "data*", "planner*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
