[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recallnext"
version = "0.1.0"
description = "Evidence-optimized food recall investigation on Exasol Personal"
requires-python = ">=3.10"
dependencies = [
  "pyexasol>=2.2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.16,<1",
]

[project.scripts]
recallnext-generate-fixture = "data.generate_fixture:main"
recallnext-load-fixture = "data.load_fixture:main"
recallnext-smoke = "backend.smoke:main"

[tool.setuptools.packages.find]
include = ["backend*", "data*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
