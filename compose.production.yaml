services:
  recallnext:
    image: recallnext:production
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:8080:8080
    networks:
      - recallnext-internal
    env_file:
      - ${RECALLNEXT_ENV_FILE:-/etc/recallnext/recallnext.env}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  recallnext-internal:
    external: true
    name: recallnext-internal
